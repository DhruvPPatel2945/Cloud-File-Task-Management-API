services:
  db:
    image: postgres:16
    container_name: task_api_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_api
    ports:
      # Host 5432 is occupied by the local Windows PostgreSQL install,
      # so the container is exposed on 5433 to avoid the clash.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/task_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
